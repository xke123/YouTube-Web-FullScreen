<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">YouTube Web Fullscreen Demo</title>
<desc id="desc">Comparison of a regular YouTube watch page with a web-fullscreen player, highlighting the custom player control button. Concept illustration, not an actual browser screenshot.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1221"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="vid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263c5e"/><stop offset=".52" stop-color="#101e37"/><stop offset="1" stop-color="#3a2457"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#252d3a"/><stop offset="1" stop-color="#151c29"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
